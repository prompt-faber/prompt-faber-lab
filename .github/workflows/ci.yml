name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install ".[dev]"
      - name: Lint
        run: |
          ruff check .
      - name: Tests
        env:
          PROMPTLAB_JWT_SECRET: test-secret
          PROMPTLAB_DATABASE_URL: sqlite+pysqlite:///./promptlab_test.db
        run: |
          pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t promptlab:core .
          docker build --build-arg PIP_EXTRAS=reports -t promptlab:report .
          docker build --build-arg PIP_EXTRAS=dashboard -t promptlab:dashboard .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy staging aqui (ex.: Terraform + ECS/GKE/AKS)."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: echo "Deploy produção aqui (ex.: Terraform + ECS/GKE/AKS)."
