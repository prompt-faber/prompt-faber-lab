[project]
name = "promptlab"
version = "0.1.0"
description = "Prompt Faber Lab — framework para testar, versionar e avaliar prompts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prompt Faber Marca Registrada" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "pandas>=2.2.0",
  "jinja2>=3.1.4",
  "prometheus-client>=0.20.0",
  "structlog>=24.1.0",
  "tenacity>=8.5.0",
  "pybreaker>=1.2.0",
  "slowapi>=0.1.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.1.19",
]

[project.optional-dependencies]
reports = ["weasyprint>=62.0"]
dashboard = ["streamlit>=1.36.0"]
packaging = ["pyinstaller>=6.8.0"]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.7",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[project.scripts]
promptlab = "promptlab.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q --cov=promptlab --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptlab*"]
